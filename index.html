<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Campañas · Piazza Internacional</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap">
<style>
:root{--bg:#f7f2ec;--ink:#1e2433;--muted:#6c675f;--line:#e4dbd0;--accent:#8a5528}
@media (prefers-color-scheme:dark){:root{--bg:#15130f;--ink:#f1ebe3;--muted:#a59d92;--line:#332e27;--accent:#e2ad80;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Jost","Futura","Avenir Next",system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:64px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
.eyebrow{font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h1{font-weight:300;font-size:clamp(2.2rem,6vw,3.4rem);margin:6px 0 36px}
ul{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
a{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
a img{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:4px}
a b{display:block;font-weight:400;font-size:1.2rem}
a span{font-size:.86rem;color:var(--muted)}
a em{font-style:normal;color:var(--accent);font-size:.86rem}
</style>
</head>
<body>
<main>
  <div class="eyebrow">Piazza Internacional · Mercadeo</div>
  <h1>Campañas</h1>
  <ul>
    <li><a href="ecko-q3-26/"><img src="ecko-q3-26/img/t/slide-2.jpg" alt=""><div><b>Deja tu huella</b><span>Ecko Unltd · Q3 2026</span></div><em>Ver</em></a></li>
    <li><a href="lookbook-q3-26/"><img src="lookbook-q3-26/img/t/p1.jpg" alt=""><div><b>Lookbook colección Q3</b><span>Ocean Pacific · Dama y Caballero · Q3 2026</span></div><em>Ver</em></a></li>
    <li><a href="op-para-todos/"><img src="op-para-todos/img/p1.jpg" alt=""><div><b>OP para todos</b><span>Ocean Pacific · Q3 2026</span></div><em>Ver</em></a></li>
  </ul>
</main>
</body>
</html>
